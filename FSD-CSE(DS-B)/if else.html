<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>armstrong</title>
</head>
<body>
    <script>
        var n=153;
        var sum=0;
        while(n>0){
            var r=n%10;
            sum+=r*r*r;
            n=n/10;

        }
        if(sum==n){
            console.log("armstrong number");
        }
            else{
                console.log("not armstrong");
            
        }
    </script>
    
    
</body>
